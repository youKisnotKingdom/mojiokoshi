services:
  # Main web application
  web:
    build: .
    image: mojiokoshi:latest
    container_name: mojiokoshi-web
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_URL=postgresql://mojiokoshi:${POSTGRES_PASSWORD:-mojiokoshi}@db:5432/mojiokoshi
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_SERVER_URI=${LDAP_SERVER_URI:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_USER_BASE_DN=${LDAP_USER_BASE_DN:-}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER:-(uid={username})}
      - LDAP_USER_ID_ATTRIBUTE=${LDAP_USER_ID_ATTRIBUTE:-uid}
      - LDAP_DISPLAY_NAME_ATTRIBUTE=${LDAP_DISPLAY_NAME_ATTRIBUTE:-cn}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_CONNECT_TIMEOUT=${LDAP_CONNECT_TIMEOUT:-5}
      - LDAP_DEFAULT_ROLE=${LDAP_DEFAULT_ROLE:-user}
      - LDAP_GROUP_BASE_DN=${LDAP_GROUP_BASE_DN:-}
      - LDAP_GROUP_FILTER=${LDAP_GROUP_FILTER:-(member={user_dn})}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-1073741824}
      - SHOW_NEXT_ACTIONS=${SHOW_NEXT_ACTIONS:-false}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:?LLM_API_BASE_URL is required}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-default}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - CHUNK_REFINEMENT_LLM_API_BASE_URL=${CHUNK_REFINEMENT_LLM_API_BASE_URL:-}
      - CHUNK_REFINEMENT_LLM_API_KEY=${CHUNK_REFINEMENT_LLM_API_KEY:-}
      - CHUNK_REFINEMENT_LLM_MODEL_NAME=${CHUNK_REFINEMENT_LLM_MODEL_NAME:-}
      - CHUNK_REFINEMENT_LLM_TEMPERATURE=${CHUNK_REFINEMENT_LLM_TEMPERATURE:-0.1}
      - CHUNK_REFINEMENT_LLM_TIMEOUT=${CHUNK_REFINEMENT_LLM_TIMEOUT:-0}
      - LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS=${LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS:-12000}
      - LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS=${LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS:-2000}
      - LLM_CHUNK_REFINEMENT_CONTEXT_CHARS=${LLM_CHUNK_REFINEMENT_CONTEXT_CHARS:-1000}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - WHISPER_DEVICE=${WEB_WHISPER_DEVICE:-cpu}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-ja}
      - DEFAULT_TRANSCRIPTION_ENGINE=${DEFAULT_TRANSCRIPTION_ENGINE:-reazon_nemo_v2}
      - COHERE_TRANSCRIBE_DEVICE=${COHERE_TRANSCRIBE_DEVICE:-cpu}
      - PARAKEET_CHUNK_SECONDS=${PARAKEET_CHUNK_SECONDS:-300}
      - PARAKEET_SAMPLE_RATE=${PARAKEET_SAMPLE_RATE:-16000}
      - AUDIO_PREPROCESSING_MODE=${AUDIO_PREPROCESSING_MODE:-light}
      - ENABLE_SPEAKER_DIARIZATION=${ENABLE_SPEAKER_DIARIZATION:-false}
      - SPEAKER_DIARIZATION_MODEL_ID=${SPEAKER_DIARIZATION_MODEL_ID:-pyannote/speaker-diarization-community-1}
      - SPEAKER_DIARIZATION_MODEL_PATH=${SPEAKER_DIARIZATION_MODEL_PATH:-}
      - SPEAKER_DIARIZATION_DEVICE=${SPEAKER_DIARIZATION_DEVICE:-auto}
      - SPEAKER_DIARIZATION_MIN_SPEAKERS=${SPEAKER_DIARIZATION_MIN_SPEAKERS:-0}
      - SPEAKER_DIARIZATION_MAX_SPEAKERS=${SPEAKER_DIARIZATION_MAX_SPEAKERS:-0}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - AUDIO_RETENTION_DAYS=${AUDIO_RETENTION_DAYS:-30}
      - WORKER_CLEANUP_INTERVAL_SECONDS=${WORKER_CLEANUP_INTERVAL_SECONDS:-3600}
      - ENABLE_REALTIME_TRANSCRIPTION=${ENABLE_REALTIME_TRANSCRIPTION:-false}
      - ADMIN_USER_ID=${ADMIN_USER_ID:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
      - models:/app/models   # Whisper モデルキャッシュ
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Background worker for transcription and summarization
  worker:
    build: .
    image: mojiokoshi:latest
    entrypoint: ["scripts/worker_entrypoint.sh"]
    command: python -m app.services.worker
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_URL=postgresql://mojiokoshi:${POSTGRES_PASSWORD:-mojiokoshi}@db:5432/mojiokoshi
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required.}
      - UPLOAD_DIR=/app/uploads
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:?LLM_API_BASE_URL is required}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-default}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - CHUNK_REFINEMENT_LLM_API_BASE_URL=${CHUNK_REFINEMENT_LLM_API_BASE_URL:-}
      - CHUNK_REFINEMENT_LLM_API_KEY=${CHUNK_REFINEMENT_LLM_API_KEY:-}
      - CHUNK_REFINEMENT_LLM_MODEL_NAME=${CHUNK_REFINEMENT_LLM_MODEL_NAME:-}
      - CHUNK_REFINEMENT_LLM_TEMPERATURE=${CHUNK_REFINEMENT_LLM_TEMPERATURE:-0.1}
      - CHUNK_REFINEMENT_LLM_TIMEOUT=${CHUNK_REFINEMENT_LLM_TIMEOUT:-0}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - WHISPER_DEVICE=${WORKER_WHISPER_DEVICE:-cuda}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-ja}
      - DEFAULT_TRANSCRIPTION_ENGINE=${DEFAULT_TRANSCRIPTION_ENGINE:-reazon_nemo_v2}
      - COHERE_TRANSCRIBE_DEVICE=${COHERE_TRANSCRIBE_DEVICE:-cpu}
      - PARAKEET_CHUNK_SECONDS=${PARAKEET_CHUNK_SECONDS:-300}
      - PARAKEET_SAMPLE_RATE=${PARAKEET_SAMPLE_RATE:-16000}
      - AUDIO_PREPROCESSING_MODE=${AUDIO_PREPROCESSING_MODE:-light}
      - ENABLE_SPEAKER_DIARIZATION=${ENABLE_SPEAKER_DIARIZATION:-false}
      - SPEAKER_DIARIZATION_MODEL_ID=${SPEAKER_DIARIZATION_MODEL_ID:-pyannote/speaker-diarization-community-1}
      - SPEAKER_DIARIZATION_MODEL_PATH=${SPEAKER_DIARIZATION_MODEL_PATH:-}
      - SPEAKER_DIARIZATION_DEVICE=${SPEAKER_DIARIZATION_DEVICE:-auto}
      - SPEAKER_DIARIZATION_MIN_SPEAKERS=${SPEAKER_DIARIZATION_MIN_SPEAKERS:-0}
      - SPEAKER_DIARIZATION_MAX_SPEAKERS=${SPEAKER_DIARIZATION_MAX_SPEAKERS:-0}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - AUDIO_RETENTION_DAYS=${AUDIO_RETENTION_DAYS:-30}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5}
      - WORKER_CLEANUP_INTERVAL_SECONDS=${WORKER_CLEANUP_INTERVAL_SECONDS:-3600}
      - WORKER_TRANSCRIPTION_CONCURRENCY=${WORKER_TRANSCRIPTION_CONCURRENCY:-1}
      - WORKER_CHUNK_REFINEMENT_CONCURRENCY=${WORKER_CHUNK_REFINEMENT_CONCURRENCY:-0}
      - WORKER_SUMMARY_CONCURRENCY=${WORKER_SUMMARY_CONCURRENCY:-0}
      - WORKER_SPEAKER_DIARIZATION_CONCURRENCY=${WORKER_SPEAKER_DIARIZATION_CONCURRENCY:-0}
      - WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS=${WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS:-3600}
      - WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS=${WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SUMMARY_STALE_TIMEOUT_SECONDS=${WORKER_SUMMARY_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS=${WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS:-14400}
      - AUTO_LLM_PROMPT_TEMPLATE_NAMES=${AUTO_LLM_PROMPT_TEMPLATE_NAMES:-文字起こし整形}
      - ENABLE_CHUNK_LLM_REFINEMENT=${ENABLE_CHUNK_LLM_REFINEMENT:-true}
      - LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS=${LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS:-12000}
      - LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS=${LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS:-2000}
      - LLM_CHUNK_REFINEMENT_CONTEXT_CHARS=${LLM_CHUNK_REFINEMENT_CONTEXT_CHARS:-1000}
    volumes:
      - uploads:/app/uploads
      - models:/app/models   # web と同じモデルボリュームを共有
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Background worker for remote-LLM chunk refinement and final LLM processing.
  # This service does not need GPU because the LLM is expected to run on another host.
  llm-worker:
    build: .
    image: mojiokoshi:latest
    container_name: mojiokoshi-llm-worker
    entrypoint: ["scripts/worker_entrypoint.sh"]
    command: python -m app.services.worker
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_URL=postgresql://mojiokoshi:${POSTGRES_PASSWORD:-mojiokoshi}@db:5432/mojiokoshi
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required.}
      - UPLOAD_DIR=/app/uploads
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:?LLM_API_BASE_URL is required}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-default}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - CHUNK_REFINEMENT_LLM_API_BASE_URL=${CHUNK_REFINEMENT_LLM_API_BASE_URL:-}
      - CHUNK_REFINEMENT_LLM_API_KEY=${CHUNK_REFINEMENT_LLM_API_KEY:-}
      - CHUNK_REFINEMENT_LLM_MODEL_NAME=${CHUNK_REFINEMENT_LLM_MODEL_NAME:-}
      - CHUNK_REFINEMENT_LLM_TEMPERATURE=${CHUNK_REFINEMENT_LLM_TEMPERATURE:-0.1}
      - CHUNK_REFINEMENT_LLM_TIMEOUT=${CHUNK_REFINEMENT_LLM_TIMEOUT:-0}
      - AUDIO_RETENTION_DAYS=${AUDIO_RETENTION_DAYS:-30}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5}
      - WORKER_CLEANUP_INTERVAL_SECONDS=${WORKER_CLEANUP_INTERVAL_SECONDS:-3600}
      - WORKER_TRANSCRIPTION_CONCURRENCY=0
      - WORKER_CHUNK_REFINEMENT_CONCURRENCY=${LLM_WORKER_CHUNK_REFINEMENT_CONCURRENCY:-2}
      - WORKER_SUMMARY_CONCURRENCY=${LLM_WORKER_SUMMARY_CONCURRENCY:-1}
      - WORKER_SPEAKER_DIARIZATION_CONCURRENCY=0
      - WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS=${WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS:-3600}
      - WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS=${WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SUMMARY_STALE_TIMEOUT_SECONDS=${WORKER_SUMMARY_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS=${WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS:-14400}
      - AUTO_LLM_PROMPT_TEMPLATE_NAMES=${AUTO_LLM_PROMPT_TEMPLATE_NAMES:-文字起こし整形}
      - ENABLE_CHUNK_LLM_REFINEMENT=${ENABLE_CHUNK_LLM_REFINEMENT:-true}
      - LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS=${LLM_CHUNK_REFINEMENT_MAX_INPUT_CHARS:-12000}
      - LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS=${LLM_CHUNK_REFINEMENT_MAX_OUTPUT_TOKENS:-2000}
      - LLM_CHUNK_REFINEMENT_CONTEXT_CHARS=${LLM_CHUNK_REFINEMENT_CONTEXT_CHARS:-1000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Background worker for post-ASR speaker diarization.
  # ASR results are completed first; this service adds speaker labels afterward.
  diarization-worker:
    profiles: ["diarization"]
    build: .
    image: mojiokoshi:latest
    container_name: mojiokoshi-diarization-worker
    entrypoint: ["scripts/worker_entrypoint.sh"]
    command: python -m app.services.worker
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_URL=postgresql://mojiokoshi:${POSTGRES_PASSWORD:-mojiokoshi}@db:5432/mojiokoshi
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required.}
      - UPLOAD_DIR=/app/uploads
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:?LLM_API_BASE_URL is required}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-default}
      - ENABLE_SPEAKER_DIARIZATION=${ENABLE_SPEAKER_DIARIZATION:-false}
      - SPEAKER_DIARIZATION_MODEL_ID=${SPEAKER_DIARIZATION_MODEL_ID:-pyannote/speaker-diarization-community-1}
      - SPEAKER_DIARIZATION_MODEL_PATH=${SPEAKER_DIARIZATION_MODEL_PATH:-}
      - SPEAKER_DIARIZATION_DEVICE=${SPEAKER_DIARIZATION_DEVICE:-auto}
      - SPEAKER_DIARIZATION_MIN_SPEAKERS=${SPEAKER_DIARIZATION_MIN_SPEAKERS:-0}
      - SPEAKER_DIARIZATION_MAX_SPEAKERS=${SPEAKER_DIARIZATION_MAX_SPEAKERS:-0}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - AUDIO_RETENTION_DAYS=${AUDIO_RETENTION_DAYS:-30}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5}
      - WORKER_CLEANUP_INTERVAL_SECONDS=${WORKER_CLEANUP_INTERVAL_SECONDS:-3600}
      - WORKER_TRANSCRIPTION_CONCURRENCY=0
      - WORKER_CHUNK_REFINEMENT_CONCURRENCY=0
      - WORKER_SUMMARY_CONCURRENCY=0
      - WORKER_SPEAKER_DIARIZATION_CONCURRENCY=${DIARIZATION_WORKER_CONCURRENCY:-1}
      - WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS=${WORKER_TRANSCRIPTION_STALE_TIMEOUT_SECONDS:-3600}
      - WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS=${WORKER_CHUNK_REFINEMENT_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SUMMARY_STALE_TIMEOUT_SECONDS=${WORKER_SUMMARY_STALE_TIMEOUT_SECONDS:-1800}
      - WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS=${WORKER_SPEAKER_DIARIZATION_STALE_TIMEOUT_SECONDS:-14400}
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Real-time transcription checker demo
  checker:
    build: .
    image: mojiokoshi:latest
    container_name: mojiokoshi-checker
    entrypoint: []
    command: uvicorn demo.checker:app --host 0.0.0.0 --port 8001 --log-level info
    ports:
      - "${CHECKER_PORT:-8001}:8001"
    environment:
      - TZ=Asia/Tokyo
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:?LLM_API_BASE_URL is required}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-default}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - WHISPER_LANGUAGE=${CHECKER_WHISPER_LANGUAGE:-ja}
      - WHISPER_DEVICE=${CHECKER_WHISPER_DEVICE:-cpu}
      - HF_HOME=/app/models
    volumes:
      - models:/app/models
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: mojiokoshi-db
    environment:
      - POSTGRES_USER=mojiokoshi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mojiokoshi}
      - POSTGRES_DB=mojiokoshi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mojiokoshi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  postgres_data:
  models:   # Whisper モデルファイル（インターネット環境で事前ダウンロード）
